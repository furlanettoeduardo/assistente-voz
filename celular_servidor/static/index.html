<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #EEF1F8; --texto: #1B2140; --suave: #5A6283;
    --lampada: #E9A62E; --brilho: rgba(233,166,46,.45); --erro: #B3261E; --linha: #CDD3E6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #161B35; --texto: #E8EBF7; --suave: #9AA2C4;
            --lampada: #F2B84B; --brilho: rgba(242,184,75,.35); --erro: #FF8A80; --linha: #2C3358; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo); color: var(--texto);
    font: 18px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  main { width: 100%; max-width: 30rem; flex: 1; display: flex; flex-direction: column; }
  #status { text-align: center; color: var(--suave); min-height: 1.5em; margin: 0 0 8px; }
  #status.erro { color: var(--erro); }
  .palco { flex: 1; display: grid; place-items: center; min-height: 260px; }
  #falar {
    width: 11rem; height: 11rem; border-radius: 50%; border: none; cursor: pointer;
    background: var(--lampada); color: #1B2140; font: 700 1.15rem/1.2 inherit;
    box-shadow: 0 0 0 0 var(--brilho); transition: box-shadow .25s, transform .15s;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #falar.ouvindo { box-shadow: 0 0 0 28px var(--brilho), 0 0 70px 30px var(--brilho); transform: scale(1.04); }
  #falar.pensando { opacity: .6; }
  #falar:focus-visible { outline: 3px solid var(--texto); outline-offset: 6px; }
  form { display: flex; gap: 8px; margin: 12px 0 20px; }
  input {
    flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px;
  }
  form button {
    font: inherit; border: 1px solid var(--linha); background: transparent; color: inherit;
    border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  ol { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--linha); padding: 12px 0; }
  .voce { color: var(--suave); margin: 0; }
  .ela { margin: 2px 0 0; }
  .acao { font-size: .85rem; color: var(--suave); margin: 4px 0 0; }
  .acao a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { #falar { transition: none; } }
</style>
</head>
<body>
<main>
  <p id="status">Segure o botão e fale</p>
  <div class="palco"><button id="falar" type="button">Segure para falar</button></div>
  <form id="formTexto">
    <input id="campo" placeholder="Ou digite um comando" autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
  <ol id="historico"></ol>
</main>

<script>
// Cada aba é uma conversa: o servidor lembra dos últimos pedidos dela ("agora fecha ele").
const CONVERSA = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);
const botao = document.getElementById("falar");
const status = document.getElementById("status");
const historico = document.getElementById("historico");
let gravador = null, pedacos = [], inicio = 0, segurando = false;

const TIPOS = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
const tipo = window.MediaRecorder ? TIPOS.find(t => MediaRecorder.isTypeSupported(t)) || "" : "";

function mostrar(texto, erro = false) {
  status.textContent = texto;
  status.classList.toggle("erro", erro);
}

// Resposta num JSON só (servidor antigo): com a voz do servidor, toca o áudio que veio junto; sem
// ela (ou se o navegador não deixar tocar), usa a voz do próprio navegador.
let somAtual = null;
function falar(texto, audio) {
  if (somAtual) { somAtual.pause(); somAtual = null; }
  if (audio) {
    somAtual = new Audio("data:audio/wav;base64," + audio);
    somAtual.play().catch(erro => {
      // Sem este aviso, a troca para a voz do navegador passaria despercebida.
      mostrar(`Não consegui tocar a voz do servidor (${erro.name}); usei a do navegador.`, true);
      falarNoNavegador(texto);
    });
    return;
  }
  falarNoNavegador(texto);
}

function falarNoNavegador(texto) {
  if (!("speechSynthesis" in window) || !texto) return;
  speechSynthesis.cancel();
  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = "pt-BR";
  const voz = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith("pt-BR"));
  if (voz) fala.voice = voz;
  speechSynthesis.speak(fala);
}

// Em streaming, a voz do servidor chega uma frase por vez e toca pela Web Audio: cada frase fica
// agendada para começar no instante em que a anterior acaba, sem pausa entre elas.
let contexto = null, fontes = [], proximo = 0;

// O navegador só libera o som da Web Audio dentro de um gesto da pessoa: a página cria (ou retoma)
// o contexto no botão e no envio do formulário.
function prepararSom() {
  if (!window.AudioContext) return;
  try {
    contexto = contexto || new AudioContext();
    if (contexto.state !== "running") contexto.resume().catch(() => {});
  } catch {} // sem a Web Audio, a fala vai pela voz do navegador
}

// Um pedido novo cala a fala anterior: as frases agendadas, o áudio do JSON e a voz do navegador.
function calar() {
  if (somAtual) { somAtual.pause(); somAtual = null; }
  fontes.forEach(f => { try { f.stop(); } catch {} }); // navegadores antigos reclamam de parar duas vezes
  fontes = [];
  proximo = 0;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

// Toca uma frase (um WAV em base64) logo depois da anterior; se não der, lança o erro do navegador.
async function tocarFrase(pedido, audio) {
  if (!contexto) prepararSom();
  if (!contexto) throw new DOMException("Este navegador não tem a Web Audio.", "NotSupportedError");
  if (contexto.state !== "running") {
    // Sem um gesto da pessoa, o resume() pode ficar esperando para sempre: não segura a fala por isso.
    let espera;
    await Promise.race([contexto.resume(), new Promise(ok => { espera = setTimeout(ok, 500); })]);
    clearTimeout(espera);
    if (contexto.state !== "running") throw new DOMException("O navegador não liberou o som.", "NotAllowedError");
  }
  const binario = atob(audio);
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  const buffer = await contexto.decodeAudioData(bytes.buffer);
  if (pedido !== pedidoAtual || pedido.calado) return; // calada enquanto decodificava
  const fonte = contexto.createBufferSource();
  fonte.buffer = buffer;
  fonte.connect(contexto.destination);
  proximo = Math.max(proximo, contexto.currentTime);
  fonte.start(proximo);
  proximo += buffer.duration;
  fontes.push(fonte);
}

// Se uma frase da voz do servidor não tocar, a voz do navegador fala a resposta inteira, uma vez só
// (depois disso tratarEvento() ignora as frases), e as já agendadas param para as duas não falarem juntas.
function usarReserva(pedido, erro) {
  if (pedido !== pedidoAtual) return; // um pedido novo calou esta fala enquanto ela decodificava
  pedido.reserva = true;
  calar();
  mostrar(`Não consegui tocar a voz do servidor (${erro.name}); usei a do navegador.`, true);
  falarNoNavegador(pedido.texto);
}

// Uma linha curta para cada ação que o servidor executou.
function descreverAcao(a) {
  const r = a.resultado || {};
  const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (a.ferramenta === "abrir_programa") {
    const nome = (a.argumentos && a.argumentos.nome) || "?";
    return r.ok ? `Abriu: ${nome}` : `Não abriu: ${nome} (${r.erro || "erro"})`;
  }
  if (r.confirmar) return r.pergunta || "Esperando a confirmação";
  return maiuscula(r.ok ? (r.descricao || "feito") : (r.erro || "algo deu errado"));
}

// A licença dos dados do Open-Meteo pede o crédito ao lado de onde a previsão aparece.
function creditoDoTempo() {
  const p = document.createElement("p");
  p.className = "acao";
  const link = (texto, url) => {
    const a = document.createElement("a"); a.href = url; a.textContent = texto; a.target = "_blank"; a.rel = "noopener";
    return a;
  };
  p.append("Dados de ", link("Open-Meteo.com", "https://open-meteo.com/"), " (",
           link("CC BY 4.0", "https://creativecommons.org/licenses/by/4.0/deed.pt-br"), "), adaptados.");
  return p;
}

function paragrafo(classe, texto) {
  const p = document.createElement("p");
  p.className = classe;
  p.textContent = texto;
  return p;
}

// Cada pedido vira um item do histórico: o que a pessoa disse aparece logo; a resposta, quando chega.
function novoItem(transcricao) {
  const item = document.createElement("li");
  item.append(paragrafo("voce", transcricao));
  historico.prepend(item);
  return item;
}

function completarItem(item, { resposta, acoes }) {
  acoes = Array.isArray(acoes) ? acoes : []; // fora do padrão, a página mostraria um erro do JavaScript em inglês
  item.append(paragrafo("ela", resposta));
  acoes.forEach(a => item.append(paragrafo("acao", descreverAcao(a))));
  if (acoes.some(a => a.ferramenta === "previsao_do_tempo" && a.resultado && a.resultado.ok)) {
    item.append(creditoDoTempo());
  }
}

function registrar(dados) {
  completarItem(novoItem(dados.transcricao), dados);
}

// Faz o pedido e devolve o JSON; queda do servidor ou resposta fora do padrão vira mensagem em português.
// Com aoEvento, uma resposta em NDJSON é lida conforme chega (cada evento vai para aoEvento) e pedir()
// devolve null; os erros de antes do streaming continuam vindo em JSON.
async function pedir(url, opcoes, aoEvento) {
  let r;
  try {
    r = await fetch(url, opcoes);
  } catch {
    throw new Error("Sem conexão com o servidor do celular. Confira se ele ainda está rodando no Termux.");
  }
  if (aoEvento && /^application\/x-ndjson\s*(;|$)/i.test(r.headers.get("Content-Type") || "")) {
    await lerEventos(r.body, aoEvento);
    return null;
  }
  const dados = await r.json().catch(() => null);
  if (!r.ok) throw new Error((dados && dados.erro) || `O servidor respondeu com erro ${r.status}. Tente de novo.`);
  if (!dados) throw new Error("O servidor mandou uma resposta que a página não entendeu. Tente de novo.");
  return dados;
}

// Lê o corpo em NDJSON (um JSON por linha) conforme chega e entrega cada evento a aoEvento, na ordem,
// esperando um terminar antes do próximo. Uma linha, ou um caractere acentuado, pode chegar cortada
// entre dois pedaços: o que sobra espera o pedaço seguinte.
async function lerEventos(corpo, aoEvento) {
  const leitor = corpo.getReader();
  const decodificador = new TextDecoder();
  let resto = "";
  for (;;) {
    let pedaco;
    try {
      pedaco = await leitor.read();
    } catch {
      throw new Error("A conexão com o servidor caiu no meio da resposta. Tente de novo.");
    }
    resto += pedaco.done ? decodificador.decode() : decodificador.decode(pedaco.value, { stream: true });
    const linhas = resto.split("\n");
    resto = pedaco.done ? "" : linhas.pop();
    try {
      for (const linha of linhas) {
        if (!linha.trim()) continue;
        let evento = null;
        try { evento = JSON.parse(linha); } catch {}
        if (!evento || typeof evento !== "object") { // "null" ou "42" também não são um evento
          throw new Error("O servidor mandou uma resposta que a página não entendeu. Tente de novo.");
        }
        await aoEvento(evento);
      }
    } catch (erro) {
      // O resto da resposta não serve mais: fecha a conexão para o servidor parar de gerar a voz à toa.
      leitor.cancel().catch(() => {});
      throw erro;
    }
    if (pedaco.done) return;
  }
}

// O pedido mais recente: só ele mexe no status e na fala. Um pedido antigo que ainda esteja chegando
// só completa o seu item do histórico.
let pedidoAtual = null;

// Os eventos do streaming, na ordem em que o servidor manda: transcricao, resposta, um audio por
// frase e fim (ou erro no lugar de resposta e fim).
async function tratarEvento(pedido, evento) {
  if (pedido.terminou) return;
  const atual = pedido === pedidoAtual;
  switch (evento.tipo) {
    case "transcricao":
      pedido.item = pedido.item || novoItem(evento.texto);
      if (atual) mostrar("Pensando…");
      break;
    case "resposta":
      pedido.texto = evento.texto || "";
      completarItem(pedido.item || (pedido.item = novoItem("")), { resposta: pedido.texto, acoes: evento.acoes });
      break;
    case "audio":
      pedido.audios++;
      if (!atual || pedido.reserva || pedido.calado) break;
      try {
        await tocarFrase(pedido, evento.audio);
      } catch (erro) {
        usarReserva(pedido, erro);
      }
      break;
    case "erro":
      pedido.terminou = true;
      if (atual) mostrar(evento.erro || "O servidor não conseguiu responder. Tente de novo.", true);
      break;
    case "fim":
      pedido.terminou = true;
      if (!atual) break;
      if (!pedido.audios && !pedido.calado) falarNoNavegador(pedido.texto);
      if (!pedido.reserva) mostrar("Segure o botão e fale"); // o aviso da troca de voz fica na tela
      break;
  }
}

async function enviar(url, opcoes) {
  const pedido = { item: null, texto: "", audios: 0, reserva: false, terminou: false };
  pedidoAtual = pedido;
  calar();
  botao.classList.add("pensando");
  mostrar("Pensando…");
  try {
    // Pede a resposta em partes (NDJSON), que o servidor manda conforme cada uma fica pronta.
    const cabecalhos = new Headers(opcoes.headers);
    cabecalhos.set("Accept", "application/x-ndjson");
    const dados = await pedir(url, { ...opcoes, headers: cabecalhos }, evento => tratarEvento(pedido, evento));
    if (dados) { // um JSON só: servidor antigo
      registrar(dados);
      if (pedido === pedidoAtual) {
        mostrar("Segure o botão e fale");
        falar(dados.resposta, dados.audio);
      }
    } else if (!pedido.terminou) {
      throw new Error("A conexão com o servidor caiu no meio da resposta. Tente de novo.");
    }
  } catch (e) {
    // Depois do fim (ou do erro), a resposta já está completa: uma queda da conexão aí não apaga o status.
    if (pedido === pedidoAtual && !pedido.terminou) mostrar(e.message, true);
  } finally {
    if (pedido === pedidoAtual) botao.classList.remove("pensando");
  }
}

async function comecar(ev) {
  ev.preventDefault();
  if (gravador || segurando) return;
  segurando = true;
  // A pessoa vai falar: a assistente para, para o microfone não captar a voz dela.
  calar();
  if (pedidoAtual) pedidoAtual.calado = true;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    segurando = false;
    return mostrar("Este navegador não grava áudio aqui. Abra pelo endereço localhost.", true);
  }
  try {
    const fluxo = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!segurando) { fluxo.getTracks().forEach(t => t.stop()); return; } // soltou antes de liberar o mic
    gravador = new MediaRecorder(fluxo, tipo ? { mimeType: tipo } : undefined);
    pedacos = [];
    gravador.ondataavailable = e => e.data.size && pedacos.push(e.data);
    gravador.onstop = () => {
      fluxo.getTracks().forEach(t => t.stop());
      const duracao = Date.now() - inicio;
      const mime = gravador.mimeType || tipo || "audio/webm";
      gravador = null;
      if (duracao < 400) return mostrar("Segure o botão enquanto fala.", true);
      const audio = new Blob(pedacos, { type: mime });
      enviar("/voz", { method: "POST", headers: { "Content-Type": mime, "X-Conversa": CONVERSA }, body: audio });
    };
    inicio = Date.now();
    gravador.start();
    botao.classList.add("ouvindo");
    mostrar("Ouvindo…");
  } catch (e) {
    segurando = false;
    mostrar("Sem acesso ao microfone. Permita o uso nas configurações do navegador.", true);
  }
}

function parar() {
  segurando = false;
  botao.classList.remove("ouvindo");
  if (gravador && gravador.state === "recording") gravador.stop();
}

// prepararSom() nos gestos: o pointerdown só vale como gesto com mouse; no toque, vale o pointerup.
botao.addEventListener("pointerdown", e => { prepararSom(); botao.setPointerCapture(e.pointerId); comecar(e); });
botao.addEventListener("pointerup", () => { prepararSom(); parar(); });
botao.addEventListener("pointercancel", parar);
botao.addEventListener("contextmenu", e => e.preventDefault());
botao.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat) { prepararSom(); comecar(e); } });
botao.addEventListener("keyup", e => { if (e.code === "Space") parar(); });

document.getElementById("formTexto").addEventListener("submit", e => {
  e.preventDefault();
  prepararSom();
  const campo = document.getElementById("campo");
  const texto = campo.value.trim();
  if (!texto) return;
  campo.value = "";
  enviar("/texto", { method: "POST", headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({ texto, conversa: CONVERSA }) });
});

if ("speechSynthesis" in window) speechSynthesis.getVoices(); // pré-carrega as vozes
</script>
</body>
</html>
